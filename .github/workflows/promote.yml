name: Promote to stable

# Fast-forwards the `release` branch to the current tip of `main`. The push
# (made with the PAT, so it triggers workflows) fires publish.yml on
# `release`, where semantic-release collapses the beta prereleases since the
# last stable version into one stable release on the npm `latest` dist-tag.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # PAT: pushes made with the default GITHUB_TOKEN don't trigger
          # other workflows, which would silently skip the stable publish.
          token: ${{ secrets.GH_PAT }}

      - name: Fast-forward release to main
        run: |
          git fetch origin main
          if git rev-parse --verify -q origin/release >/dev/null; then
            if ! git merge-base --is-ancestor origin/release origin/main; then
              echo "::error::release is not an ancestor of main — cannot fast-forward" >&2
              exit 1
            fi
          fi
          git push origin origin/main:refs/heads/release
